services:
  # Gateway mode. The Slide API token arrives per request on X-Slide-Api-Token.
  # Do not set SLIDE_API_TOKEN or env_file here. That would put a static
  # vendor credential in the container. The project .env is used only for
  # Compose interpolation of CONDUIT_S2S_SECRET. For AUTH_MODE=env, pass
  # SLIDE_API_TOKEN on that process instead (see the README).
  slide-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
